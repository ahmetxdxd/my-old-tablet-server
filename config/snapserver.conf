[server]
threads = -1
datadir = /tmp/snapcast

[http]
enabled = true
bind_to_address = 0.0.0.0
port = 1780

[tcp]
enabled = true
bind_to_address = 0.0.0.0
port = 1705

[stream]
bind_to_address = 0.0.0.0
port = 1704
sampleformat = 48000:16:2
codec = flac
chunk_ms = 20
buffer = 150
source = process:///usr/bin/pw-record?name=PC_Audio&codec=flac&sampleformat=48000:16:2&params=--target%2050%20--raw%20--rate%2048000%20--channels%202%20--format%20s16%20-

# ==============================================================================
# MY TABLET SERVER - CAVA Frutiger Aero Audio Visualizer Config
# ==============================================================================

[general]
framerate = 60
bars = 0
bar_width = 2
bar_spacing = 1
lower_cutoff_freq = 50
higher_cutoff_freq = 12000

[input]
method = pipewire
source = auto

[output]
method = noncurses
orientation = bottom
channels = stereo
mono_option = average

[color]
gradient = 1
gradient_count = 6
gradient_color_1 = '#005577'
gradient_color_2 = '#0088aa'
gradient_color_3 = '#00ccaa'
gradient_color_4 = '#00ff88'
gradient_color_5 = '#38ef7d'
gradient_color_6 = '#ffffff'

[smoothing]
noise_reduction = 60
monstercat = 1
waves = 1
gravity = 120
